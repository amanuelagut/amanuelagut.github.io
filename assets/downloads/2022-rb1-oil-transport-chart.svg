<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" style="background:white;">
  <defs>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#cd853f;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="transportGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4a7c2f;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1" y="1" width="698" height="318" fill="none" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Background grid -->
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="60" y1="40" x2="680" y2="40"/>
    <line x1="60" y1="80" x2="680" y2="80"/>
    <line x1="60" y1="120" x2="680" y2="120"/>
    <line x1="60" y1="160" x2="680" y2="160"/>
    <line x1="60" y1="200" x2="680" y2="200"/>
    <line x1="60" y1="240" x2="680" y2="240"/>
  </g>

  <!-- Y-axis labels -->
  <g font-family="'DM Sans',sans-serif" font-size="10" fill="#5a5a55" text-anchor="end">
    <text x="55" y="44">180</text>
    <text x="55" y="84">150</text>
    <text x="55" y="124">120</text>
    <text x="55" y="164">90</text>
    <text x="55" y="204">60</text>
    <text x="55" y="244">30</text>
  </g>

  <!-- X-axis labels -->
  <g font-family="'DM Sans',sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="80" y="275">Jan 18</text>
    <text x="165" y="275">Jan 19</text>
    <text x="250" y="275">Jan 20</text>
    <text x="335" y="275">Jan 21</text>
    <text x="420" y="275">Jan 22</text>
    <text x="505" y="275">Jul 22</text>
    <text x="590" y="275">Dec 22</text>
  </g>

  <!-- COVID marker -->
  <line x1="250" y1="40" x2="250" y2="260" stroke="#d32f2f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="32" font-family="'DM Sans',sans-serif" font-size="8" fill="#d32f2f" text-anchor="middle">COVID</text>

  <!-- Ukraine marker -->
  <line x1="420" y1="40" x2="420" y2="260" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="420" y="32" font-family="'DM Sans',sans-serif" font-size="8" fill="#1565c0" text-anchor="middle">Ukraine</text>

  <!-- Brent Oil line (brown) - Jan18=100, Apr20=27, Mar22=170 -->
  <polyline fill="none" stroke="url(#oilGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="80,160 95,162 110,160 125,152 140,145 155,150 170,150 185,154 200,142 215,135 230,152 250,230 265,248 280,218 295,195 310,175 335,168 350,160 365,156 380,148 395,135 410,122 420,45 435,40 450,55 465,72 480,62 505,58 520,78 535,88 550,98 565,92 580,92 590,118"/>

  <!-- Transport Cost line (green) - smoother, lower amplitude -->
  <polyline fill="none" stroke="url(#transportGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="80,160 95,161 110,161 125,158 140,156 155,154 170,154 185,155 200,150 215,148 230,150 250,155 265,162 280,158 295,155 310,153 335,150 350,146 365,142 380,138 395,132 410,126 420,114 435,105 450,98 465,92 480,88 505,84 520,92 535,98 550,102 565,104 580,104 590,108"/>

  <!-- Peak markers -->
  <circle cx="435" cy="40" r="5" fill="#8b4513"/>
  <text x="435" y="32" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513" text-anchor="middle">170</text>

  <circle cx="505" cy="84" r="5" fill="#2d5016"/>
  <text x="520" y="78" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016" text-anchor="start">124</text>

  <!-- COVID trough -->
  <circle cx="265" cy="248" r="4" fill="#8b4513"/>
  <text x="275" y="255" font-family="'DM Sans',sans-serif" font-size="7" fill="#8b4513" text-anchor="start">27</text>

  <!-- Legend -->
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="150" height="55" fill="white" stroke="#c8d4c0" rx="3"/>
    <line x1="10" y1="18" x2="35" y2="18" stroke="#8b4513" stroke-width="2.5"/>
    <text x="42" y="21" font-family="'DM Sans',sans-serif" font-size="10" fill="#1a1a18">Brent Crude (Index)</text>
    <line x1="10" y1="38" x2="35" y2="38" stroke="#2d5016" stroke-width="2.5"/>
    <text x="42" y="41" font-family="'DM Sans',sans-serif" font-size="10" fill="#1a1a18">Transport Costs</text>
  </g>

  <!-- Title -->
  <text x="370" y="18" font-family="'EB Garamond',serif" font-size="13" fill="#1e3a0f" text-anchor="middle" font-weight="500">Oil Price vs. Transport Cost Index (Jan 2018 = 100)</text>

  <!-- Source -->
  <text x="350" y="295" font-family="'DM Sans',sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Sources: FRED DCOILBRENTEU, SIPSA-DANE transport margins | r = 0.78, beta = 0.42</text>
</svg>
