<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" style="background:white;">
  <!-- Grid lines -->
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="70" y1="50" x2="660" y2="50"/>
    <line x1="70" y1="90" x2="660" y2="90"/>
    <line x1="70" y1="130" x2="660" y2="130"/>
    <line x1="70" y1="170" x2="660" y2="170"/>
    <line x1="70" y1="210" x2="660" y2="210"/>
  </g>

  <!-- Y-axis labels (spread %) -->
  <g font-family="Arial,sans-serif" font-size="10" fill="#5a5a55" text-anchor="end">
    <text x="65" y="54">16%</text>
    <text x="65" y="94">14%</text>
    <text x="65" y="134">12%</text>
    <text x="65" y="174">10%</text>
    <text x="65" y="214">8%</text>
    <text x="65" y="254">6%</text>
  </g>

  <!-- X-axis labels (months) -->
  <g font-family="Arial,sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="100" y="275">Mar</text>
    <text x="162" y="275">Apr</text>
    <text x="224" y="275">May</text>
    <text x="286" y="275">Jun</text>
    <text x="348" y="275">Jul</text>
    <text x="410" y="275">Aug</text>
    <text x="472" y="275">Sep</text>
    <text x="534" y="275">Oct</text>
    <text x="596" y="275">Nov</text>
    <text x="640" y="275">Dec</text>
  </g>

  <!-- Lockdown zone shading -->
  <rect x="100" y="45" width="186" height="210" fill="#d32f2f" fill-opacity="0.06"/>
  <text x="193" y="38" font-family="Arial,sans-serif" font-size="8" fill="#d32f2f" text-anchor="middle">Peak Lockdown</text>

  <!-- Frijol line (green) -->
  <polyline fill="none" stroke="#2d5016" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,206 162,154 224,76 286,96 348,122 410,142 472,158 534,162 596,172 640,180"/>

  <!-- Arroz line (gold) -->
  <polyline fill="none" stroke="#daa520" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,230 162,226 224,220 286,224 348,230 410,236 472,234 534,228 596,230 640,236"/>

  <!-- Maiz line (brown) -->
  <polyline fill="none" stroke="#8b4513" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,188 162,104 224,114 286,130 348,150 410,156 472,162 534,168 596,174 640,178"/>

  <!-- Peak marker for Frijol -->
  <circle cx="224" cy="76" r="5" fill="#2d5016"/>
  <text x="224" y="66" font-family="Arial,sans-serif" font-size="9" fill="#2d5016" text-anchor="middle" font-weight="600">14.7%</text>

  <!-- Legend -->
  <g transform="translate(480, 55)">
    <rect x="0" y="0" width="170" height="60" fill="white" stroke="#c8d4c0" rx="3"/>
    <line x1="10" y1="15" x2="35" y2="15" stroke="#2d5016" stroke-width="2.5"/>
    <text x="42" y="18" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18">Frijol (CV: 24.3%)</text>
    <line x1="10" y1="32" x2="35" y2="32" stroke="#8b4513" stroke-width="2.5"/>
    <text x="42" y="35" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18">Maiz (CV: 14.6%)</text>
    <line x1="10" y1="49" x2="35" y2="49" stroke="#daa520" stroke-width="2.5"/>
    <text x="42" y="52" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18">Arroz (CV: 8.1%)</text>
  </g>

  <!-- Title -->
  <text x="365" y="22" font-family="Georgia,serif" font-size="13" fill="#1e3a0f" text-anchor="middle" font-weight="500">Bogota-Ibague Price Spread by Product (Mar-Dec 2020)</text>

  <!-- Source -->
  <text x="350" y="292" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Source: SIPSA-DANE Boletin Mensual Mayoristas</text>
</svg>
