<svg width="700" height="320" viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" style="background:white">
  <defs>
    <linearGradient id="importGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a7c2f;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="volatilityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#ef5350;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="22" font-family="Georgia,serif" font-size="14" fill="#1e3a0f" text-anchor="middle" font-weight="500">Agricultural Import Cost Index and Volatility (2019–2023)</text>
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="60" y1="50" x2="640" y2="50"/>
    <line x1="60" y1="100" x2="640" y2="100"/>
    <line x1="60" y1="150" x2="640" y2="150"/>
    <line x1="60" y1="200" x2="640" y2="200"/>
    <line x1="60" y1="250" x2="640" y2="250"/>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#2d5016" text-anchor="end">
    <text x="55" y="54">160</text>
    <text x="55" y="104">140</text>
    <text x="55" y="154">120</text>
    <text x="55" y="204">100</text>
    <text x="55" y="254">80</text>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#d32f2f" text-anchor="start">
    <text x="645" y="54">25%</text>
    <text x="645" y="104">20%</text>
    <text x="645" y="154">15%</text>
    <text x="645" y="204">10%</text>
    <text x="645" y="254">5%</text>
  </g>
  <g font-family="sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="100" y="280">2019-Q1</text>
    <text x="200" y="280">2020-Q1</text>
    <text x="300" y="280">2021-Q1</text>
    <text x="400" y="280">2022-Q1</text>
    <text x="500" y="280">2022-Q4</text>
    <text x="600" y="280">2023-Q4</text>
  </g>
  <polyline fill="none" stroke="url(#importGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,204 150,195 200,155 250,175 300,145 350,118 400,128 450,95 500,55 550,78 600,145"/>
  <polyline fill="none" stroke="url(#volatilityGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,3"
