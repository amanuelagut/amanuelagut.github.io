  <circle cx="500" cy="55" r="5" fill="#2d5016"/>
  <text x="510" y="52" font-family="sans-serif" font-size="9" fill="#2d5016">Peak: 152</text>
  <circle cx="450" cy="75" r="4" fill="#d32f2f"/>
  <text x="460" y="72" font-family="sans-serif" font-size="9" fill="#d32f2f">22.6%</text>
  <g transform="translate(480, 180)">
    <rect x="0" y="0" width="150" height="55" fill="white" stroke="#c8d4c0" rx="3"/>
    <line x1="10" y1="18" x2="35" y2="18" stroke="#2d5016" stroke-width="2.5"/>
    <text x="42" y="21" font-family="sans-serif" font-size="10" fill="#1a1a18">Import Cost Index</text>
    <line x1="10" y1="38" x2="35" y2="38" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="42" y="41" font-family="sans-serif" font-size="10" fill="#1a1a18">Volatility Index</text>
