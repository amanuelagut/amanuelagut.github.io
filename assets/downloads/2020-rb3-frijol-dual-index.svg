<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" style="background:white;">
  <!-- Title -->
  <text x="300" y="22" font-family="Georgia,serif" font-size="13" fill="#1e3a0f" text-anchor="middle" font-weight="500">Frijol Price Index: Bogota vs Ibague (Mar 2020 = 100)</text>

  <!-- Grid lines -->
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="70" y1="55" x2="560" y2="55"/>
    <line x1="70" y1="95" x2="560" y2="95"/>
    <line x1="70" y1="135" x2="560" y2="135"/>
    <line x1="70" y1="175" x2="560" y2="175"/>
    <line x1="70" y1="215" x2="560" y2="215"/>
    <line x1="70" y1="255" x2="560" y2="255"/>
  </g>

  <!-- Y-axis labels -->
  <g font-family="Arial,sans-serif" font-size="10" fill="#5a5a55" text-anchor="end">
    <text x="65" y="59">130</text>
    <text x="65" y="99">120</text>
    <text x="65" y="139">110</text>
    <text x="65" y="179">100</text>
    <text x="65" y="219">90</text>
    <text x="65" y="259">80</text>
  </g>

  <!-- X-axis labels -->
  <g font-family="Arial,sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="95" y="280">Mar</text>
    <text x="145" y="280">Apr</text>
    <text x="195" y="280">May</text>
    <text x="245" y="280">Jun</text>
    <text x="295" y="280">Jul</text>
    <text x="345" y="280">Aug</text>
    <text x="395" y="280">Sep</text>
    <text x="445" y="280">Oct</text>
    <text x="495" y="280">Nov</text>
    <text x="545" y="280">Dec</text>
  </g>

  <!-- Peak divergence zone -->
  <rect x="170" y="50" width="100" height="215" fill="#d32f2f" fill-opacity="0.05"/>
  <text x="220" y="45" font-family="Arial,sans-serif" font-size="8" fill="#d32f2f" text-anchor="middle">Peak Divergence</text>

  <!-- Bogota line (forest green) - Index: Mar=100, Apr=110, May=130, Jun=121, Jul=110, Aug=106, Sep=103, Oct=101, Nov=98, Dec=96 -->
  <polyline fill="none" stroke="#1e3a0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="95,175 145,135 195,55 245,91 295,135 345,151 395,163 445,171 495,183 545,191"/>

  <!-- Ibague line (sage green) - Index: Mar=100, Apr=107, May=122, Jun=116, Jul=107, Aug=104, Sep=102, Oct=99, Nov=97, Dec=96 -->
  <polyline fill="none" stroke="#4a7c2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,4"
    points="95,175 145,147 195,87 245,111 295,147 345,159 395,167 445,179 495,187 545,191"/>

  <!-- Peak markers -->
  <circle cx="195" cy="55" r="5" fill="#1e3a0f"/>
  <text x="195" y="47" font-family="Arial,sans-serif" font-size="9" fill="#1e3a0f" text-anchor="middle" font-weight="600">129.6</text>

  <circle cx="195" cy="87" r="5" fill="#4a7c2f"/>
  <text x="210" y="80" font-family="Arial,sans-serif" font-size="9" fill="#4a7c2f" text-anchor="start">122.3</text>

  <!-- Spread annotation -->
  <line x1="200" y1="55" x2="200" y2="87" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="215" y="71" font-family="Arial,sans-serif" font-size="8" fill="#d32f2f">+7.3 pp</text>

  <!-- Legend -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="150" height="45" fill="white" stroke="#c8d4c0" rx="3"/>
    <line x1="10" y1="15" x2="35" y2="15" stroke="#1e3a0f" stroke-width="2.5"/>
    <text x="42" y="18" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18">Bogota</text>
    <line x1="10" y1="32" x2="35" y2="32" stroke="#4a7c2f" stroke-width="2.5" stroke-dasharray="8,4"/>
    <text x="42" y="35" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18">Ibague</text>
  </g>

  <!-- Convergence annotation -->
  <text x="520" y="200" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Convergence</text>
  <text x="520" y="210" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">by Dec 2020</text>

  <!-- Source -->
  <text x="300" y="310" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Source: SIPSA-DANE Boletin Mensual Mayoristas (Corabastos Bogota, Plaza de la 21 Ibague)</text>
</svg>
