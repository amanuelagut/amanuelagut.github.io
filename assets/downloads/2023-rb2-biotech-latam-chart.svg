      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a7c2f;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="argGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  <rect width="700" height="320" fill="white"/>
  <text x="350" y="22" font-family="Georgia,serif" font-size="14" fill="#1e3a0f" text-anchor="middle" font-weight="500">Biotech Soybean Adoption Rate by Country (2015–2023)</text>
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="80" y1="50" x2="660" y2="50"/>
    <line x1="80" y1="100" x2="660" y2="100"/>
