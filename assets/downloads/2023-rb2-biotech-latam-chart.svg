  <circle cx="530" cy="68" r="4" fill="#1565c0"/>
  <text x="545" y="72" font-family="sans-serif" font-size="9" fill="#1565c0">Argentina: 98.3%</text>
  <circle cx="530" cy="92" r="4" fill="#2d5016"/>
  <text x="545" y="96" font-family="sans-serif" font-size="9" fill="#2d5016">Brazil: 97.7%</text>
  <g transform="translate(480, 180)">
    <rect x="0" y="0" width="160" height="55" fill="white" stroke="#c8d4c0" rx="3"/>
