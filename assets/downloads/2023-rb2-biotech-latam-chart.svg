    <text x="75" y="104">95%</text>
    <text x="75" y="154">90%</text>
    <text x="75" y="204">85%</text>
    <text x="75" y="254">80%</text>
  </g>
  <g font-family="sans-serif" font-size="10" fill="#5a5a55" text-anchor="middle">
