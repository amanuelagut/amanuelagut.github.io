<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" style="background:white;">
  <defs>
    <linearGradient id="usaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a7c2f;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="euGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="asiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff8f00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:0.8"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1" y="1" width="698" height="318" fill="none" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Background grid -->
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="60" y1="50" x2="650" y2="50"/>
    <line x1="60" y1="100" x2="650" y2="100"/>
    <line x1="60" y1="150" x2="650" y2="150"/>
    <line x1="60" y1="200" x2="650" y2="200"/>
    <line x1="60" y1="250" x2="650" y2="250"/>
  </g>

  <!-- Y-axis labels (Partner Share %) -->
  <g font-family="'DM Sans',sans-serif" font-size="10" fill="#5a5a55" text-anchor="end">
    <text x="55" y="54">40%</text>
    <text x="55" y="104">30%</text>
    <text x="55" y="154">20%</text>
    <text x="55" y="204">10%</text>
    <text x="55" y="254">0%</text>
  </g>

  <!-- X-axis labels -->
  <g font-family="'DM Sans',sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="100" y="275">2015</text>
    <text x="195" y="275">2016</text>
    <text x="290" y="275">2017</text>
    <text x="385" y="275">2018</text>
    <text x="480" y="275">2019</text>
    <text x="550" y="275">2020</text>
    <text x="620" y="275">2021</text>
  </g>

  <!-- USA line (green) - 38.2% to 34.5% -->
  <polyline fill="none" stroke="url(#usaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,54 195,56 290,62 385,68 480,74 550,84 620,82"/>

  <!-- EU line (blue) - 20.4% to 20.1% -->
  <polyline fill="none" stroke="url(#euGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,148 195,146 290,148 385,148 480,150 550,148 620,150"/>

  <!-- Asia (Japan+Korea) line (orange) - 9.5% to 12.1% -->
  <polyline fill="none" stroke="url(#asiaGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="100,212 195,200 290,186 385,178 480,164 550,166 620,154"/>

  <!-- Data point markers -->
  <circle cx="100" cy="54" r="4" fill="#2d5016"/>
  <circle cx="620" cy="82" r="4" fill="#2d5016"/>
  <circle cx="100" cy="212" r="4" fill="#ff8f00"/>
  <circle cx="620" cy="154" r="4" fill="#ff8f00"/>

  <!-- Annotations -->
  <text x="100" y="44" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016" text-anchor="middle">38.2%</text>
  <text x="620" y="72" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016" text-anchor="middle">34.5%</text>
  <text x="620" y="144" font-family="'DM Sans',sans-serif" font-size="8" fill="#ff8f00" text-anchor="middle">12.1%</text>

  <!-- Legend -->
  <g transform="translate(480, 55)">
    <rect x="0" y="0" width="160" height="70" fill="white" stroke="#c8d4c0" rx="3"/>
    <line x1="10" y1="15" x2="35" y2="15" stroke="#2d5016" stroke-width="2.5"/>
    <text x="42" y="18" font-family="'DM Sans',sans-serif" font-size="9" fill="#1a1a18">United States</text>
    <line x1="10" y1="32" x2="35" y2="32" stroke="#1565c0" stroke-width="2.5"/>
    <text x="42" y="35" font-family="'DM Sans',sans-serif" font-size="9" fill="#1a1a18">European Union</text>
    <line x1="10" y1="49" x2="35" y2="49" stroke="#ff8f00" stroke-width="2.5"/>
    <text x="42" y="52" font-family="'DM Sans',sans-serif" font-size="9" fill="#1a1a18">Asia (Japan+Korea)</text>
  </g>

  <!-- Title -->
  <text x="350" y="22" font-family="'EB Garamond',serif" font-size="13" fill="#1e3a0f" text-anchor="middle" font-weight="500">Colombian Agricultural Export Share by Partner (2015-2021)</text>

  <!-- Source -->
  <text x="350" y="300" font-family="'DM Sans',sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Source: UN Comtrade, Colombian agricultural exports (HS 01-24)</text>
</svg>
