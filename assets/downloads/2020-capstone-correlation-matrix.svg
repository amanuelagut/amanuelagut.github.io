<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="450" height="400" viewBox="0 0 450 400" style="background:white;">
  <!-- Title -->
  <text x="225" y="25" font-family="Georgia,serif" font-size="14" fill="#1e3a0f" text-anchor="middle" font-weight="500">Correlation Matrix</text>
  <text x="225" y="42" font-family="Arial,sans-serif" font-size="10" fill="#5a5a55" text-anchor="middle">Frijol, USD/COP, Brent (n=20 months)</text>

  <!-- Matrix grid -->
  <g transform="translate(100, 70)">
    <!-- Column headers -->
    <text x="60" y="-10" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="middle">Frijol</text>
    <text x="160" y="-10" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="middle">USD/COP</text>
    <text x="260" y="-10" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="middle">Brent</text>

    <!-- Row headers -->
    <text x="-10" y="55" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="end">Frijol</text>
    <text x="-10" y="155" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="end">USD/COP</text>
    <text x="-10" y="255" font-family="Arial,sans-serif" font-size="10" fill="#1a1a18" text-anchor="end">Brent</text>

    <!-- Cell backgrounds (color-coded by correlation strength) -->
    <!-- Frijol-Frijol (1.00) - dark green -->
    <rect x="10" y="10" width="100" height="90" fill="#1e3a0f"/>
    <!-- Frijol-USD/COP (0.42) - light green -->
    <rect x="110" y="10" width="100" height="90" fill="#7cb342"/>
    <!-- Frijol-Brent (-0.38) - light red -->
    <rect x="210" y="10" width="100" height="90" fill="#ef9a9a"/>

    <!-- USD/COP-Frijol (0.42) - light green -->
    <rect x="10" y="110" width="100" height="90" fill="#7cb342"/>
    <!-- USD/COP-USD/COP (1.00) - dark green -->
    <rect x="110" y="110" width="100" height="90" fill="#1e3a0f"/>
    <!-- USD/COP-Brent (-0.82) - dark red -->
    <rect x="210" y="110" width="100" height="90" fill="#c62828"/>

    <!-- Brent-Frijol (-0.38) - light red -->
    <rect x="10" y="210" width="100" height="90" fill="#ef9a9a"/>
    <!-- Brent-USD/COP (-0.82) - dark red -->
    <rect x="110" y="210" width="100" height="90" fill="#c62828"/>
    <!-- Brent-Brent (1.00) - dark green -->
    <rect x="210" y="210" width="100" height="90" fill="#1e3a0f"/>

    <!-- Correlation values -->
    <text x="60" y="60" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">1.00</text>
    <text x="160" y="60" font-family="Arial,sans-serif" font-size="16" fill="#1a1a18" text-anchor="middle" font-weight="600">0.42</text>
    <text x="260" y="60" font-family="Arial,sans-serif" font-size="16" fill="#1a1a18" text-anchor="middle" font-weight="600">-0.38</text>

    <text x="60" y="160" font-family="Arial,sans-serif" font-size="16" fill="#1a1a18" text-anchor="middle" font-weight="600">0.42</text>
    <text x="160" y="160" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">1.00</text>
    <text x="260" y="160" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">-0.82</text>

    <text x="60" y="260" font-family="Arial,sans-serif" font-size="16" fill="#1a1a18" text-anchor="middle" font-weight="600">-0.38</text>
    <text x="160" y="260" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">-0.82</text>
    <text x="260" y="260" font-family="Arial,sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="600">1.00</text>

    <!-- Grid lines -->
    <g stroke="#5a5a55" stroke-width="1">
      <line x1="10" y1="10" x2="310" y2="10"/>
      <line x1="10" y1="100" x2="310" y2="100"/>
      <line x1="10" y1="200" x2="310" y2="200"/>
      <line x1="10" y1="300" x2="310" y2="300"/>
      <line x1="10" y1="10" x2="10" y2="300"/>
      <line x1="110" y1="10" x2="110" y2="300"/>
      <line x1="210" y1="10" x2="210" y2="300"/>
      <line x1="310" y1="10" x2="310" y2="300"/>
    </g>
  </g>

  <!-- Color scale legend -->
  <g transform="translate(100, 345)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="9" fill="#5a5a55">Correlation Scale:</text>
    <rect x="90" y="-10" width="30" height="15" fill="#c62828"/>
    <text x="125" y="0" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55">-1.0</text>
    <rect x="145" y="-10" width="30" height="15" fill="#ef9a9a"/>
    <text x="180" y="0" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55">-0.5</text>
    <rect x="200" y="-10" width="30" height="15" fill="#e8ede4"/>
    <text x="235" y="0" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55">0</text>
    <rect x="250" y="-10" width="30" height="15" fill="#7cb342"/>
    <text x="285" y="0" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55">+0.5</text>
    <rect x="305" y="-10" width="30" height="15" fill="#1e3a0f"/>
    <text x="340" y="0" font-family="Arial,sans-serif" font-size="8" fill="#5a5a55">+1.0</text>
  </g>

  <!-- Key insight -->
  <rect x="30" y="372" width="390" height="22" fill="#e8ede4" rx="3"/>
  <text x="225" y="387" font-family="Arial,sans-serif" font-size="9" fill="#d32f2f" text-anchor="middle" font-weight="500">Key: USD/COP vs Brent r=-0.82 confirms oil-export dependence</text>
</svg>
