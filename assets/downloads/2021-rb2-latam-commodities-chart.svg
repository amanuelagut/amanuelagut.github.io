<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" style="background:white;">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a7c2f;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1" y="1" width="698" height="318" fill="none" stroke="#c8d4c0" stroke-width="1"/>

  <!-- Background grid -->
  <g stroke="#e8ede4" stroke-width="1">
    <line x1="180" y1="40" x2="650" y2="40"/>
    <line x1="180" y1="40" x2="180" y2="280"/>
    <line x1="274" y1="40" x2="274" y2="280"/>
    <line x1="368" y1="40" x2="368" y2="280"/>
    <line x1="462" y1="40" x2="462" y2="280"/>
    <line x1="556" y1="40" x2="556" y2="280"/>
    <line x1="650" y1="40" x2="650" y2="280"/>
  </g>

  <!-- X-axis labels (CAGR %) -->
  <g font-family="'DM Sans',sans-serif" font-size="9" fill="#5a5a55" text-anchor="middle">
    <text x="180" y="295">0%</text>
    <text x="274" y="295">5%</text>
    <text x="368" y="295">10%</text>
    <text x="462" y="295">15%</text>
    <text x="556" y="295">20%</text>
    <text x="650" y="295">25%</text>
  </g>

  <!-- Commodity labels -->
  <g font-family="'DM Sans',sans-serif" font-size="9" fill="#1a1a18" text-anchor="end">
    <text x="175" y="55">Blueberries</text>
    <text x="175" y="75">Sunflower Seeds</text>
    <text x="175" y="95">Quinoa</text>
    <text x="175" y="115">Avocados</text>
    <text x="175" y="135">Soybeans</text>
    <text x="175" y="155">Pulses</text>
    <text x="175" y="175">Processed Poultry</text>
    <text x="175" y="195">Frozen Fish</text>
    <text x="175" y="215">Cocoa</text>
    <text x="175" y="235">Coffee</text>
    <text x="175" y="255">Wheat</text>
    <text x="175" y="275">Bananas</text>
  </g>

  <!-- Bars (CAGR values) -->
  <!-- Blueberries 20.2% -->
  <rect x="180" y="48" width="380" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="565" y="57" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">20.2%</text>

  <!-- Sunflower 19.9% -->
  <rect x="180" y="68" width="374" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="559" y="77" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">19.9%</text>

  <!-- Quinoa 18.6% -->
  <rect x="180" y="88" width="350" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="535" y="97" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">18.6%</text>

  <!-- Avocados 16.1% -->
  <rect x="180" y="108" width="303" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="488" y="117" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">16.1%</text>

  <!-- Soybeans 14.3% -->
  <rect x="180" y="128" width="269" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="454" y="137" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">14.3%</text>

  <!-- Pulses 12.2% -->
  <rect x="180" y="148" width="229" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="414" y="157" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">12.2%</text>

  <!-- Poultry 12.1% -->
  <rect x="180" y="168" width="227" height="12" fill="url(#barGrad)" rx="1"/>
  <text x="412" y="177" font-family="'DM Sans',sans-serif" font-size="8" fill="#2d5016">12.1%</text>

  <!-- Fish 9.8% -->
  <rect x="180" y="188" width="184" height="12" fill="#8b4513" rx="1"/>
  <text x="369" y="197" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513">9.8%</text>

  <!-- Cocoa 8.3% -->
  <rect x="180" y="208" width="156" height="12" fill="#8b4513" rx="1"/>
  <text x="341" y="217" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513">8.3%</text>

  <!-- Coffee 4.7% -->
  <rect x="180" y="228" width="88" height="12" fill="#8b4513" rx="1"/>
  <text x="273" y="237" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513">4.7%</text>

  <!-- Wheat 1.2% -->
  <rect x="180" y="248" width="23" height="12" fill="#8b4513" rx="1"/>
  <text x="208" y="257" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513">1.2%</text>

  <!-- Bananas 0.9% -->
  <rect x="180" y="268" width="17" height="12" fill="#8b4513" rx="1"/>
  <text x="202" y="277" font-family="'DM Sans',sans-serif" font-size="8" fill="#8b4513">0.9%</text>

  <!-- Legend -->
  <g transform="translate(520, 40)">
    <rect x="0" y="0" width="120" height="42" fill="white" stroke="#c8d4c0" rx="3"/>
    <rect x="10" y="10" width="20" height="8" fill="url(#barGrad)" rx="1"/>
    <text x="35" y="17" font-family="'DM Sans',sans-serif" font-size="8" fill="#1a1a18">High Growth</text>
    <rect x="10" y="24" width="20" height="8" fill="#8b4513" rx="1"/>
    <text x="35" y="31" font-family="'DM Sans',sans-serif" font-size="8" fill="#1a1a18">Moderate/Low</text>
  </g>

  <!-- Title -->
  <text x="350" y="20" font-family="'EB Garamond',serif" font-size="13" fill="#1e3a0f" text-anchor="middle" font-weight="500">LATAM Agricultural Commodity CAGR 2018-2021</text>

  <!-- Source -->
  <text x="350" y="310" font-family="'DM Sans',sans-serif" font-size="8" fill="#5a5a55" text-anchor="middle">Source: UN Comtrade, Latin American agricultural trade flows</text>
</svg>
